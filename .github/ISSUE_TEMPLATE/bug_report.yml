name: Bug Report
description: Report a bug or unexpected behavior in FerrisCD
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Clear summary of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact commands, manifests, or test steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Rust version:
        - Kubernetes / kind version:
        - Commit SHA / tag:
    validations:
      required: true

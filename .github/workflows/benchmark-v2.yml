# TEMPORARY — `T20.5` acceptance benchmark.
#
# This workflow runs the 250-application / 2,500-resource / 3-shard fleet soak
# (60 minutes) on a throwaway `kind` cluster and publishes the harness' verdict
# (`summary.txt`) in the job summary.
#
# It exists so the 60-minute soak does not have to run on a developer's laptop.
# It is **not** part of the permanent CI gate: remove this file once the `v2.0`
# release is signed off (the harness itself stays in `benchmarks/`).
name: v2 Fleet Benchmark (temporary)

on:
  # `workflow_dispatch` only works once this file is on the default branch, so the
  # one-off run on the release branch is triggered by a push whose commit message
  # contains `[benchmark]`. The guard below means ordinary pushes do not start a
  # 60-minute soak.
  push:
    branches: [feat/v2-release]
  workflow_dispatch:
    inputs:
      apps:
        description: "Applications in the fleet"
        required: false
        default: "250"
      soak_minutes:
        description: "Soak duration in minutes"
        required: false
        default: "60"
      total_shards:
        description: "Control-plane shards"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: v2-fleet-benchmark
  cancel-in-progress: false

jobs:
  fleet-benchmark:
    name: 250 apps / 2,500 resources / 3 shards
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[benchmark]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Installed directly (with checksum verification) rather than through
      # `install-action`: it resolves `kind` as a Cargo crate and fails.
      - name: Install kind and kubectl
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64"
          kind_sha="$(curl -fsSL "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum" | awk '{print $1}')"
          echo "${kind_sha}  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl"
          kubectl_sha="$(curl -fsSL "https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256")"
          echo "${kubectl_sha}  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          kind version
          kubectl version --client

      - name: Create the throwaway kind cluster
        run: |
          set -euo pipefail
          kind create cluster --name ferriscd-bench --wait 120s
          kubectl config current-context

      - name: Install the CRDs and the control-plane namespace
        run: |
          set -euo pipefail
          kubectl apply -f deploy/crds/
          kubectl create namespace ferriscd-system
          kubectl wait --for=condition=Established --timeout=120s \
            crd/applications.ferriscd.io crd/appprojects.ferriscd.io crd/applicationsets.ferriscd.io

      - name: Run the sharded fleet benchmark
        env:
          BENCH_APPS: ${{ github.event.inputs.apps || '250' }}
          BENCH_SOAK_MINUTES: ${{ github.event.inputs.soak_minutes || '60' }}
          BENCH_TOTAL_SHARDS: ${{ github.event.inputs.total_shards || '3' }}
        run: |
          set -euo pipefail
          # Workflow inputs go through `env`, never straight into a shell line, and are
          # validated here: a dispatch input must not be able to inject commands.
          for pair in "BENCH_APPS=${BENCH_APPS}" "BENCH_SOAK_MINUTES=${BENCH_SOAK_MINUTES}" "BENCH_TOTAL_SHARDS=${BENCH_TOTAL_SHARDS}"; do
            [[ "${pair#*=}" =~ ^[0-9]+$ ]] || { echo "invalid numeric input: ${pair}"; exit 2; }
          done
          ./benchmarks/scale_250_sharded.sh \
            --apps "${BENCH_APPS}" \
            --resources-per-app 10 \
            --total-shards "${BENCH_TOTAL_SHARDS}" \
            --soak-minutes "${BENCH_SOAK_MINUTES}" \
            --warmup-minutes 5 \
            --sample-interval 30 \
            --commit-interval 600 \
            --drift-interval 300 \
            --convergence-timeout 1800 \
            --drift-heal-timeout 180 \
            --control-plane-namespace ferriscd-system \
            --results-dir benchmark-results

      - name: Publish the benchmark verdict
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### FerrisCD v2.0 fleet benchmark"
            echo
            if [[ -f benchmark-results/summary.txt ]]; then
              echo '```'
              cat benchmark-results/summary.txt
              echo '```'
            else
              echo "The benchmark did not produce a summary (see the job log)."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the raw artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-fleet-benchmark
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 14

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  yaml-hygiene:
    name: YAML & Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate YAML files
        run: |
          ruby -ryaml -e '
            files = Dir.glob("{.github,deploy,examples}/**/*.{yml,yaml}")
            # Helm chart templates are Go templates, not data YAML; `helm template` (and the
            # ignored v0_4_renderers tests) validate them. Chart.yaml/values*/crds/ stay checked.
            files.reject! { |f| f.start_with?("examples/helm/templates/") }
            abort("No YAML files found") if files.empty?
            files.sort.each do |f|
              YAML.load_stream(File.read(f))
              puts "OK: #{f}"
            end
          '

  ci:
    name: Format, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect Rust workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@1.100.0
        if: steps.workspace.outputs.has_cargo == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.workspace.outputs.has_cargo == 'true'

      - name: Check formatting
        if: steps.workspace.outputs.has_cargo == 'true'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: steps.workspace.outputs.has_cargo == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Clippy (engine test-utils feature)
        if: steps.workspace.outputs.has_cargo == 'true'
        run: K8S_OPENAPI_ENABLED_VERSION=1.35 cargo clippy -p ferriscd-engine --features test-utils --all-targets -- -D warnings

      - name: Run tests
        if: steps.workspace.outputs.has_cargo == 'true'
        run: cargo test --workspace

  web-ui:
    name: Web UI Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ferriscd-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ferriscd-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check OpenAPI TypeScript schema drift
        run: |
          npm run generate-api
          git diff --exit-code src/api/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

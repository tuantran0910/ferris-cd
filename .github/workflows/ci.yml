name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: ${{ vars.CI_CARGO_JOBS || '4' }}

jobs:
  yaml-hygiene:
    name: YAML & Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate YAML files
        run: |
          ruby -ryaml -e '
            files = Dir.glob("{.github,deploy,examples}/**/*.{yml,yaml}")
            # Helm chart templates are Go templates, not data YAML; `helm template` (and the
            # ignored v0_4_renderers tests) validate them. Chart.yaml/values*/crds/ stay checked.
            files.reject! do |f|
              f.start_with?("examples/helm/templates/") ||
                f.start_with?("deploy/helm/ferriscd/templates/")
            end
            abort("No YAML files found") if files.empty?
            files.sort.each do |f|
              YAML.load_stream(File.read(f))
              puts "OK: #{f}"
            end
          '

      - name: Check CRD sync (deploy/crds vs Helm & Kustomize)
        run: |
          for crd in applications.ferriscd.io.yaml appprojects.ferriscd.io.yaml applicationsets.ferriscd.io.yaml; do
            diff -u "deploy/crds/${crd}" "deploy/helm/ferriscd/crds/${crd}"
            diff -u "deploy/crds/${crd}" "deploy/manifests/crds/${crd}"
          done

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint and validate Helm chart & Kustomize overlay
        run: |
          helm lint deploy/helm/ferriscd
          helm lint deploy/helm/ferriscd -f deploy/helm/ferriscd/values-ha.yaml

          helm template ferriscd deploy/helm/ferriscd -n ferriscd-system | ruby -ryaml -e '
            docs = YAML.load_stream($stdin.read).compact
            abort("No rendered Helm docs") if docs.empty?
            cluster_roles = docs.select { |d| d["kind"] == "ClusterRole" }
            deployments = docs.select { |d| d["kind"] == "Deployment" }
            netpols = docs.select { |d| d["kind"] == "NetworkPolicy" }
            abort("Missing ClusterRole in Helm default manifests") if cluster_roles.empty?
            abort("Missing Deployment in Helm default manifests") if deployments.empty?
            abort("Missing NetworkPolicy in Helm default manifests") if netpols.empty?

            cluster_roles.each do |d|
              (d["rules"] || []).each do |r|
                groups = r["apiGroups"] || []
                res = r["resources"] || []
                verbs = r["verbs"] || []
                abort("Default ClusterRole must not grant */* wildcard") if groups.include?("*") && res.include?("*")
                abort("Default ClusterRole must not grant secrets") if res.include?("secrets")
                abort("Default ClusterRole must not grant impersonate") if verbs.include?("impersonate")
                abort("Default ClusterRole must not grant rbac.authorization.k8s.io") if groups.include?("rbac.authorization.k8s.io")
                if res.include?("customresourcedefinitions")
                  extra = verbs - %w[get list watch]
                  abort("Default ClusterRole must grant read-only CRDs, got verbs: #{verbs}") unless extra.empty?
                end
              end
            end

            deployments.each do |d|
              name = d.dig("metadata", "name")
              pod = d.dig("spec", "template", "spec") || {}
              psc = pod["securityContext"] || {}
              abort("#{name} must set runAsNonRoot: true") unless psc["runAsNonRoot"] == true
              abort("#{name} must set runAsUser: 65532") unless psc["runAsUser"] == 65532
              abort("#{name} must set RuntimeDefault seccomp") unless psc.dig("seccompProfile", "type") == "RuntimeDefault"
              (pod["containers"] || []).each do |c|
                sc = c["securityContext"] || {}
                abort("#{c["name"]} must set readOnlyRootFilesystem: true") unless sc["readOnlyRootFilesystem"] == true
                abort("#{c["name"]} must set allowPrivilegeEscalation: false") unless sc["allowPrivilegeEscalation"] == false
                abort("#{c["name"]} must drop ALL capabilities") unless (sc.dig("capabilities", "drop") || []).include?("ALL")
              end
            end

            netpols.each do |d|
              name = d.dig("metadata", "name")
              pt = d.dig("spec", "policyTypes") || []
              abort("NetworkPolicy #{name} must set policyTypes [Ingress, Egress], got #{pt}") unless pt == %w[Ingress Egress]
              (d.dig("spec", "egress") || []).each_with_index do |rule, idx|
                to = rule["to"]
                abort("NetworkPolicy #{name} egress[#{idx}] must not omit to:") unless to.is_a?(Array) && !to.empty?
                to.each do |peer|
                  ipb = peer["ipBlock"]
                  next unless ipb && ipb["cidr"] == "0.0.0.0/0"
                  except = ipb["except"] || []
                  abort("NetworkPolicy #{name} egress[#{idx}] 0.0.0.0/0 must exclude 169.254.169.254/32") unless except.include?("169.254.169.254/32")
                end
              end
            end
            puts "OK: Helm default template (#{docs.size} manifests)"
          '

          helm template ferriscd deploy/helm/ferriscd -n custom-ns | ruby -ryaml -e '
            docs = YAML.load_stream($stdin.read).compact
            proj = docs.find { |d| d["kind"] == "AppProject" && d.dig("metadata", "name") == "default" }
            abort("Missing default AppProject in custom-ns render") unless proj
            sns = proj.dig("spec", "sourceNamespaces")
            abort("Expected default AppProject spec.sourceNamespaces == [\"custom-ns\"], got #{sns.inspect}") unless sns == ["custom-ns"]
            puts "OK: Helm custom-ns AppProject sourceNamespaces=#{sns.inspect}"
          '

          if helm template ferriscd deploy/helm/ferriscd -n ferriscd-system \
            --set sharding.enabled=true \
            --set sharding.shardId=0 \
            --set sharding.totalShards=2 \
            --set leaderElection.leaseName=custom-lease >/dev/null 2>&1; then
            echo "ERROR: expected sharding + leaderElection.leaseName to fail helm template" >&2
            exit 1
          fi
          echo "OK: Helm rejects sharding + leaderElection.leaseName"

          helm template ferriscd deploy/helm/ferriscd -n ferriscd-system \
            --set 'rbacPolicy.rules[0].subject.kind=group' \
            --set 'rbacPolicy.rules[0].subject.name=platform-admins' \
            --set 'rbacPolicy.rules[0].project=*' \
            --set 'rbacPolicy.rules[0].actions[0]=admin' | ruby -ryaml -e '
            docs = YAML.load_stream($stdin.read).compact
            cm = docs.find { |d| d["kind"] == "ConfigMap" && d.dig("metadata", "name") == "ferriscd-rbac-cm" }
            abort("Missing ferriscd-rbac-cm ConfigMap") unless cm
            policy_raw = cm.dig("data", "policy.yaml")
            abort("Missing policy.yaml in ferriscd-rbac-cm") unless policy_raw.is_a?(String) && !policy_raw.empty?
            policy = YAML.safe_load(policy_raw)
            rules = policy.is_a?(Hash) ? policy["rules"] : nil
            abort("Expected 1 rule in policy.yaml, got #{policy.inspect}") unless rules.is_a?(Array) && rules.size == 1
            r = rules.first
            unless r.dig("subject", "kind") == "group" && r.dig("subject", "name") == "platform-admins" && r["project"] == "*" && r["actions"] == ["admin"]
              abort("Unexpected RBAC policy rule: #{r.inspect}")
            end
            puts "OK: Helm non-empty rbacPolicy.rules renders valid policy.yaml"
          '

          helm template ferriscd deploy/helm/ferriscd -n ferriscd-system \
            -f deploy/helm/ferriscd/values-ha.yaml \
            --set metrics.serviceMonitor.enabled=true \
            --set rbac.impersonation.enabled=true \
            --set networkPolicy.enabled=true \
            --set telemetry.otlpEndpoint=http://otel-collector.monitoring:4318 \
            --set 'multiTenant.applicationNamespaces[0]=team-a' \
            --set webhooks.existingSecret=ferriscd-webhooks \
            --set podDisruptionBudget.maxUnavailable=1 | ruby -ryaml -e '
            docs = YAML.load_stream($stdin.read).compact
            kinds = docs.map { |d| d["kind"] }
            %w[Deployment PodDisruptionBudget ServiceMonitor NetworkPolicy ClusterRole Role].each do |k|
              abort("Missing #{k} in HA rendered manifests") unless kinds.include?(k)
            end
            pdb = docs.find { |d| d["kind"] == "PodDisruptionBudget" }
            pdb_spec = pdb["spec"] || {}
            abort("PDB with maxUnavailable must not also set minAvailable: #{pdb_spec}") unless pdb_spec["maxUnavailable"] == 1 && !pdb_spec.key?("minAvailable")
            docs.select { |d| d["kind"] == "NetworkPolicy" }.each do |d|
              name = d.dig("metadata", "name")
              (d.dig("spec", "egress") || []).each_with_index do |rule, idx|
                to = rule["to"]
                abort("HA NetworkPolicy #{name} egress[#{idx}] must not omit to:") unless to.is_a?(Array) && !to.empty?
                to.each do |peer|
                  ipb = peer["ipBlock"]
                  next unless ipb && ipb["cidr"] == "0.0.0.0/0"
                  except = ipb["except"] || []
                  abort("HA NetworkPolicy #{name} egress[#{idx}] 0.0.0.0/0 must exclude 169.254.169.254/32") unless except.include?("169.254.169.254/32")
                end
              end
            end
            puts "OK: Helm HA+features template (#{docs.size} manifests)"
          '

          KUSTOMIZE_OUT=$(if command -v kustomize >/dev/null 2>&1; then kustomize build deploy/manifests; else kubectl kustomize deploy/manifests; fi)
          printf "%s\n" "$KUSTOMIZE_OUT" | ruby -ryaml -e '
            docs = YAML.load_stream($stdin.read).compact
            abort("No rendered Kustomize docs") if docs.empty?
            cluster_roles = docs.select { |d| d["kind"] == "ClusterRole" }
            deployments = docs.select { |d| d["kind"] == "Deployment" }
            netpols = docs.select { |d| d["kind"] == "NetworkPolicy" }
            abort("Missing ClusterRole in Kustomize manifests") if cluster_roles.empty?
            abort("Missing Deployment in Kustomize manifests") if deployments.empty?
            abort("Missing NetworkPolicy in Kustomize manifests") if netpols.empty?

            cluster_roles.each do |d|
              (d["rules"] || []).each do |r|
                groups = r["apiGroups"] || []
                res = r["resources"] || []
                verbs = r["verbs"] || []
                abort("Kustomize ClusterRole must not grant */* wildcard") if groups.include?("*") && res.include?("*")
                abort("Kustomize ClusterRole must not grant secrets") if res.include?("secrets")
                abort("Kustomize ClusterRole must not grant impersonate") if verbs.include?("impersonate")
                abort("Kustomize ClusterRole must not grant rbac.authorization.k8s.io") if groups.include?("rbac.authorization.k8s.io")
                if res.include?("customresourcedefinitions")
                  extra = verbs - %w[get list watch]
                  abort("Kustomize ClusterRole must grant read-only CRDs, got verbs: #{verbs}") unless extra.empty?
                end
              end
            end

            deployments.each do |d|
              name = d.dig("metadata", "name")
              pod = d.dig("spec", "template", "spec") || {}
              psc = pod["securityContext"] || {}
              abort("Kustomize #{name} must set runAsNonRoot: true") unless psc["runAsNonRoot"] == true
              abort("Kustomize #{name} must set runAsUser: 65532") unless psc["runAsUser"] == 65532
              abort("Kustomize #{name} must set RuntimeDefault seccomp") unless psc.dig("seccompProfile", "type") == "RuntimeDefault"
              (pod["containers"] || []).each do |c|
                sc = c["securityContext"] || {}
                abort("Kustomize #{c["name"]} must set readOnlyRootFilesystem: true") unless sc["readOnlyRootFilesystem"] == true
                abort("Kustomize #{c["name"]} must set allowPrivilegeEscalation: false") unless sc["allowPrivilegeEscalation"] == false
                abort("Kustomize #{c["name"]} must drop ALL capabilities") unless (sc.dig("capabilities", "drop") || []).include?("ALL")
              end
            end

            netpols.each do |d|
              name = d.dig("metadata", "name")
              pt = d.dig("spec", "policyTypes") || []
              abort("Kustomize NetworkPolicy #{name} must set policyTypes [Ingress, Egress], got #{pt}") unless pt == %w[Ingress Egress]
              (d.dig("spec", "egress") || []).each_with_index do |rule, idx|
                to = rule["to"]
                abort("Kustomize NetworkPolicy #{name} egress[#{idx}] must not omit to:") unless to.is_a?(Array) && !to.empty?
                to.each do |peer|
                  ipb = peer["ipBlock"]
                  next unless ipb && ipb["cidr"] == "0.0.0.0/0"
                  except = ipb["except"] || []
                  abort("Kustomize NetworkPolicy #{name} egress[#{idx}] 0.0.0.0/0 must exclude 169.254.169.254/32") unless except.include?("169.254.169.254/32")
                end
              end
            end
            puts "OK: Kustomize overlay (#{docs.size} manifests)"
          '

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run Clippy (engine test-utils + opa-policy features)
        run: K8S_OPENAPI_ENABLED_VERSION=1.35 cargo clippy --locked -p ferriscd-engine --features test-utils,opa-policy --all-targets -- -D warnings

      - name: Run Clippy (controller opa-policy feature)
        run: K8S_OPENAPI_ENABLED_VERSION=1.35 cargo clippy --locked -p ferriscd-controller --features opa-policy --all-targets -- -D warnings

  test:
    name: Test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --locked --workspace

  feature-tests:
    name: Feature tests (opa-policy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests (embedded Rego engine)
        run: K8S_OPENAPI_ENABLED_VERSION=1.35 cargo test --locked -p ferriscd-engine --features opa-policy

      - name: Run tests (controller with the Rego engine wired)
        run: cargo test --locked -p ferriscd-controller --features opa-policy

      - name: Check the shipped binary with the Rego engine
        run: cargo check --locked -p ferriscd-cli --features opa-policy

  ci:
    name: Format, Clippy & Test
    needs: [lint, test, feature-tests, web-ui, web-e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required Rust, web and browser checks passed."

  web-ui:
    name: Web UI Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ferriscd-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ferriscd-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check OpenAPI TypeScript schema drift
        run: |
          npm run generate-api
          git diff --exit-code src/api/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  web-e2e:
    name: Web E2E (Playwright, mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ferriscd-web
    env:
      NODE_ENV: test
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ferriscd-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke, accessibility and responsive tests
        run: npm run test:e2e:ci

  security:
    name: Supply-Chain Security (cargo-deny, cargo-audit, npm audit, SHA pinning)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce supply-chain policy (SHA pins, cosign digests, advisory expiry)
        run: ruby .github/scripts/check-supply-chain.rb

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0

      - name: Restore cached RustSec advisory database
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/advisory-db
            ~/.cargo/advisory-db-deny
          key: advisory-db-${{ github.run_id }}
          restore-keys: |
            advisory-db-

      - name: Repair cached advisory database if it is not a git checkout
        run: |
          set -euo pipefail
          for db in "${HOME}/.cargo/advisory-db" "${HOME}/.cargo/advisory-db-deny"; do
            if [[ -d "${db}" && ! -d "${db}/.git" ]]; then
              echo "cached advisory DB ${db} is not a git checkout; dropping it"
              rm -rf "${db}"
            fi
          done

      - name: Install cargo-deny (host binary so the cached advisory DB applies)
        uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2.90.9
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo-deny (licenses, advisories, bans, sources)
        run: cargo deny check --hide-inclusion-graph

      - name: Install cargo-audit (prebuilt host binary; keeps the gate under 90 s)
        uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2.90.9
        with:
          tool: cargo-audit@0.23.0

      - name: Run cargo-audit (RUSTSEC database)
        run: cargo audit --file Cargo.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ferriscd-web/package-lock.json

      # Production dependencies are the blocking gate; devDependency advisories are tracked in
      # issue #51 (vitest 5 upgrade) and reported by the weekly `security-audit.yml` job.
      - name: Audit production Web UI dependencies
        working-directory: apps/ferriscd-web
        run: npm audit --omit=dev --audit-level=high

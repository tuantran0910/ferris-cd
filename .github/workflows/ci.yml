name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  yaml-hygiene:
    name: YAML & Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML files
        run: |
          ruby -ryaml -e '
            files = Dir.glob("{.github,deploy,examples}/**/*.{yml,yaml}")
            abort("No YAML files found") if files.empty?
            files.sort.each do |f|
              YAML.load_stream(File.read(f))
              puts "OK: #{f}"
            end
          '

  ci:
    name: Format, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Rust workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@1.120.0
        if: steps.workspace.outputs.has_cargo == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.workspace.outputs.has_cargo == 'true'

      - name: Check formatting
        if: steps.workspace.outputs.has_cargo == 'true'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: steps.workspace.outputs.has_cargo == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        if: steps.workspace.outputs.has_cargo == 'true'
        run: cargo test --workspace

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run_version:
        description: "Version string used for dry-run artifacts (no images pushed or GitHub Release published)"
        required: false
        default: "0.0.0-dryrun"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      repo_lower: ${{ steps.meta.outputs.repo_lower }}
    steps:
      - name: Compute version and mode
        id: meta
        env:
          DRY_RUN_VERSION: ${{ inputs.dry_run_version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_TAG="true"
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            IS_TAG="false"
            VERSION="${DRY_RUN_VERSION:-0.0.0-dryrun}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: version '${VERSION}' must be valid single-line SemVer (X.Y.Z or X.Y.Z-prerelease)" >&2
            exit 1
          fi

          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          REPO_LOWER="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          {
            echo "is_tag=${IS_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "repo_lower=${REPO_LOWER}"
          } >> "${GITHUB_OUTPUT}"

  sbom-workspace:
    name: Generate Rust Workspace CycloneDX SBOM
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sbom-workspace

      - name: Generate CycloneDX SBOM for Rust workspace
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx --version 0.5.7
          mkdir -p dist/sbom
          cargo cyclonedx --format json --spec-version 1.5 --top-level
          cp ferriscd-cli.cdx.json "dist/sbom/ferriscd-${VERSION}-workspace.cdx.json"

      - name: Upload workspace SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-workspace
          path: dist/sbom/ferriscd-*-workspace.cdx.json
          if-no-files-found: error

  build-binaries:
    name: Build CLI/Server Binary (${{ matrix.target }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config

      - name: Build release binary
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p ferriscd-cli
          BINARY="target/${{ matrix.target }}/release/ferriscd"
          "${BINARY}" --version

      - name: Package tarball and SHA-256 checksum
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE_DIR="dist/ferriscd-${VERSION}-${TARGET}"
          mkdir -p "${STAGE_DIR}"
          cp "target/${TARGET}/release/ferriscd" "${STAGE_DIR}/ferriscd"
          cp LICENSE README.md "${STAGE_DIR}/"

          ARCHIVE="ferriscd-${VERSION}-${TARGET}.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE}" "ferriscd-${VERSION}-${TARGET}"

          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            else
              shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            fi
            cat "${ARCHIVE}.sha256"
          )

      - name: Generate SLSA Level 3 build provenance attestation for binary archive
        if: needs.metadata.outputs.is_tag == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/ferriscd-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.tar.gz

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/ferriscd-*.tar.gz
            dist/ferriscd-*.tar.gz.sha256
          if-no-files-found: error

  package-helm:
    name: Package Helm Chart
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint and package Helm chart
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          helm lint deploy/helm/ferriscd
          helm lint deploy/helm/ferriscd -f deploy/helm/ferriscd/values-ha.yaml
          mkdir -p dist/helm
          helm package deploy/helm/ferriscd \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist/helm
          (
            cd dist/helm
            sha256sum ferriscd-*.tgz > "ferriscd-${VERSION}.tgz.sha256"
            cat "ferriscd-${VERSION}.tgz.sha256"
          )

      - name: Generate SLSA Level 3 build provenance attestation for Helm chart
        if: needs.metadata.outputs.is_tag == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/helm/ferriscd-${{ needs.metadata.outputs.version }}.tgz

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helm-chart
          path: |
            dist/helm/ferriscd-*.tgz
            dist/helm/ferriscd-*.tgz.sha256
          if-no-files-found: error

  container-control-plane:
    name: Build, Sign & Attest Multi-Arch Control Plane Image
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: needs.metadata.outputs.is_tag == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ needs.metadata.outputs.repo_lower }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.is_tag == 'true' && needs.metadata.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ needs.metadata.outputs.version }},enable=${{ needs.metadata.outputs.is_tag != 'true' }}

      - name: Build and push multi-arch control-plane image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.metadata.outputs.is_tag == 'true' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

      - name: Generate CycloneDX SBOM for control-plane container image (Syft)
        if: needs.metadata.outputs.is_tag == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ needs.metadata.outputs.repo_lower }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ferriscd-${{ needs.metadata.outputs.version }}-image.cdx.json

      - name: Install Cosign for keyless OIDC image signing
        if: needs.metadata.outputs.is_tag == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Keyless sign & attest control-plane image strictly by immutable digest
        if: needs.metadata.outputs.is_tag == 'true'
        env:
          IMAGE_REF: ghcr.io/${{ needs.metadata.outputs.repo_lower }}@${{ steps.build.outputs.digest }}
          SBOM_FILE: ferriscd-${{ needs.metadata.outputs.version }}-image.cdx.json
        run: |
          set -euo pipefail
          if [[ "${IMAGE_REF}" != *@sha256:* ]]; then
            echo "ERROR: refusing to sign mutable tag; expected immutable @sha256: digest (${IMAGE_REF})" >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE_REF}"
          cosign attest --yes --type cyclonedx --predicate "${SBOM_FILE}" "${IMAGE_REF}"

      - name: Generate SLSA Level 3 build provenance attestation for control-plane image digest
        if: needs.metadata.outputs.is_tag == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ needs.metadata.outputs.repo_lower }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload control-plane image SBOM artifact
        if: needs.metadata.outputs.is_tag == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-image-control-plane
          path: ferriscd-${{ needs.metadata.outputs.version }}-image.cdx.json
          if-no-files-found: error

  container-web:
    name: Build, Sign & Attest Multi-Arch Web UI Image
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: needs.metadata.outputs.is_tag == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ needs.metadata.outputs.repo_lower }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.is_tag == 'true' && needs.metadata.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ needs.metadata.outputs.version }},enable=${{ needs.metadata.outputs.is_tag != 'true' }}

      - name: Build and push multi-arch web UI image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/ferriscd-web
          file: apps/ferriscd-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.metadata.outputs.is_tag == 'true' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha,scope=web-ui
          cache-to: type=gha,mode=max,scope=web-ui

      - name: Generate CycloneDX SBOM for Web UI container image (Syft)
        if: needs.metadata.outputs.is_tag == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ needs.metadata.outputs.repo_lower }}-web@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ferriscd-web-${{ needs.metadata.outputs.version }}-image.cdx.json

      - name: Install Cosign for keyless OIDC image signing
        if: needs.metadata.outputs.is_tag == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Keyless sign & attest Web UI image strictly by immutable digest
        if: needs.metadata.outputs.is_tag == 'true'
        env:
          IMAGE_REF: ghcr.io/${{ needs.metadata.outputs.repo_lower }}-web@${{ steps.build.outputs.digest }}
          SBOM_FILE: ferriscd-web-${{ needs.metadata.outputs.version }}-image.cdx.json
        run: |
          set -euo pipefail
          if [[ "${IMAGE_REF}" != *@sha256:* ]]; then
            echo "ERROR: refusing to sign mutable tag; expected immutable @sha256: digest (${IMAGE_REF})" >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE_REF}"
          cosign attest --yes --type cyclonedx --predicate "${SBOM_FILE}" "${IMAGE_REF}"

      - name: Generate SLSA Level 3 build provenance attestation for Web UI image digest
        if: needs.metadata.outputs.is_tag == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ needs.metadata.outputs.repo_lower }}-web
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload Web UI image SBOM artifact
        if: needs.metadata.outputs.is_tag == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-image-web
          path: ferriscd-web-${{ needs.metadata.outputs.version }}-image.cdx.json
          if-no-files-found: error

  publish-release:
    name: Assemble Checksums, SBOMs & Publish GitHub Release
    needs:
      - metadata
      - sbom-workspace
      - build-binaries
      - package-helm
      - container-control-plane
      - container-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Assemble unified SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-artifacts
          rm -f *.sha256
          shopt -s nullglob
          FILES=(ferriscd-*.tar.gz ferriscd-*.tgz ferriscd-*.cdx.json)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "ERROR: no release artifacts found" >&2
            exit 1
          fi
          LC_ALL=C sha256sum "${FILES[@]}" | sort -k2 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload dry-run release bundle
        if: needs.metadata.outputs.is_tag != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dryrun-${{ needs.metadata.outputs.version }}
          path: |
            release-artifacts/ferriscd-*.tar.gz
            release-artifacts/ferriscd-*.tgz
            release-artifacts/ferriscd-*.cdx.json
            release-artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: needs.metadata.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: FerrisCD ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-artifacts/ferriscd-*.tar.gz
            release-artifacts/ferriscd-*.tgz
            release-artifacts/ferriscd-*.cdx.json
            release-artifacts/SHA256SUMS.txt

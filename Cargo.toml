[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
k8s-openapi = { version = "0.29", features = ["schemars"] }
kube = { version = "5.1", features = ["runtime", "derive", "client", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

ferriscd-crd = { path = "crates/ferriscd-crd" }
ferriscd-engine = { path = "crates/ferriscd-engine" }
ferriscd-controller = { path = "crates/ferriscd-controller" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

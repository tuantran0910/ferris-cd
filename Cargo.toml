[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
# `T14.1`: the in-process REST API of the modular monolith (ADR-002). No new transitive dependency
# is introduced that the lock file did not already carry (`axum` sits on `hyper`/`tower`/`http`,
# which `kube-client` already pulls in).
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
base64 = "0.22"
# `env` lets the webhook secrets come from `FERRISCD_*_WEBHOOK_*` instead of argv (a flag is
# visible in `ps`); no new crate, clap already ships the feature.
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
# `T18.3`: gzip decompression for OCI artifact layers (`application/vnd.*.tar+gzip`). The
# `tar` reader is written in-house (`ferriscd-engine/src/repo/oci.rs`) because every entry type
# except plain files/directories must be rejected — a parser we own makes that deny-list
# exhaustive instead of a set of flags on someone else's unpacker.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
# `T17.2`: OS CSPRNG for RFC 4122 UUIDv4 audit `eventId` and `X-Request-Id` generation. Already in
# the lock file (used by `ring`, `kube`, `reqwest`); adds zero new crates.
getrandom = "0.3"
# `http`/`hyper-util`/`hyper-timeout`/`tower` back the `T12.3` impersonation tower layer over the
# controller's shared base HTTP/TLS connector. All four are already in the lock file (they are
# `kube-client` dependencies); no new transitive dependency is introduced.
http = "1"
hyper-timeout = "0.5"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# `rustls` itself, to pin the process-level `CryptoProvider`. Two providers are linked in this
# workspace (`ring` via `kube`, `aws-lc-rs` via `gix`'s `reqwest`), and `rustls` refuses to guess
# between them — see `ferriscd_controller::impersonation::ensure_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Constant-time comparison for the `T14.2` webhook signature/token checks. Already in the lock file
# (`rustls` and `ring` depend on it): comparing a MAC with `==` leaks how much of it matched.
subtle = "2"
# `T17.4`: IANA time-zone rules for `AppProject.spec.syncWindows`. `jiff` is already in the
# dependency graph (`k8s-openapi` re-exports it), but with `alloc` only — i.e. with no tzdb at all,
# so `TimeZone::get("America/New_York")` would fail at runtime. The bundled database keeps window
# evaluation independent of the host's `/usr/share/zoneinfo`, which `debian:bookworm-slim` does not
# ship. Enabling the feature adds no package: `jiff-tzdb` and `jiff-static` are already in
# `Cargo.lock`.
jiff = { version = "0.2", default-features = false, features = [
    "std",
    "tzdb-bundle-always",
] }
# `T19.1`: JOSE signature verification (`RS256`, `ES256`, `ES384`, `EdDSA`) for OIDC access tokens.
# Already in the lock file as the workspace's pinned `rustls` crypto provider (see below), so this
# adds no package — and deliberately no `jsonwebtoken`-style JWT crate: the algorithm allowlist, the
# `alg`/key-type pairing and the claim checks are the security boundary of this feature and are
# written out where a reviewer can read them.
ring = "0.17"
tower = { version = "0.5", features = ["retry", "util"] }
# `utoipa` generates the OpenAPI 3.1 contract `GET /api/v1/openapi.json` serves and
# `docs/api/openapi.json` freezes (`T14.1`); the TypeScript web UI is typed from it (`T16.1`).
utoipa = "5"
gix = { version = "0.90", default-features = false, features = [
    "sha1",
    "max-performance",
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-mutation",
    "revision",
    "credentials",
] }
# RFC 6901 JSON Pointers for `spec.ignoreDifferences` (already in the lock file via `json-patch`).
jsonptr = { version = "0.7", features = ["std", "json", "delete"] }
k8s-openapi = { version = "0.29", features = ["schemars"] }
kube = { version = "5.1", features = ["runtime", "derive", "client", "rustls-tls"] }
# `T14.5`: the CLI's HTTP client for `ferriscd-server`. Already in the lock file (`gix`'s blocking
# HTTP transport pulls it in), so this adds no new package; only the async rustls + JSON path is
# enabled, and the workspace's process-level crypto provider (`ring`) is installed at startup so the
# CLI and the controller use the same TLS stack.
# `stream` lets `T19.1` read the JWKS response body through a size-capped byte stream instead of
# `bytes()`: an IdP that answers with a 1 GiB body must not be able to allocate it. It adds one
# wasm-only shim to the lock file (`wasm-streams`), which is not compiled for any native target.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls",
    "stream",
] }
# `T15.1`: the low-cardinality Prometheus registry behind `/metrics`. The only new package this
# task adds; the exposition format (text 0.0.4) and the histogram/counter/gauge primitives all
# come from it, so the label sets are typed (`EncodeLabelSet`) instead of formatted by hand.
prometheus-client = "0.26"
# `T20.2`: the optional embedded OPA/Rego engine behind the `opa-policy` feature (default off).
# `regorus` is Microsoft's pure-Rust Rego interpreter: no C-ABI, no subprocess, no network.
# `default-features = false` is the whole security story — every I/O builtin (`http.send`,
# `net.lookup_ip_addr`, `time.now_ns`, `regex.*`, `opa.runtime`, `uuid.*`, `json.patch`, …) lives
# behind one of those features, so the build simply does not contain them. `std` stays on because
# it is what gives the interpreter a monotonic clock for its execution timer (the per-evaluation
# CPU cap); `T17.5` re-audited the resulting tree (all MIT/Apache-2.0/BSD-3-Clause, already on the
# `deny.toml` allowlist).
regorus = { version = "0.15", default-features = false, features = ["std"] }
# `T15.2`: optional OpenTelemetry OTLP trace export, enabled only when `OTEL_EXPORTER_OTLP_ENDPOINT`
# is set. `reqwest-blocking-client` (not `reqwest-client`) is deliberate: `BatchSpanProcessor` runs
# on its own background OS thread without a Tokio reactor, and `reqwest-rustls` shares the
# process-level `ring` TLS crypto provider installed at startup.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
tracing-opentelemetry = "0.34"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.2"
# `T18.3`: SHA-256 of OCI manifests and layers, compared against the immutable
# `sha256:<64-hex>` digest before any byte is extracted or handed to a renderer.
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# Cooperative cancellation (`CancellationToken`) for the `T13.2` leader lease: a lost renewal must
# stop reconciliation immediately. Already in the lock file (`kube-runtime` depends on it).
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

ferriscd-crd = { path = "crates/ferriscd-crd" }
ferriscd-engine = { path = "crates/ferriscd-engine" }
ferriscd-controller = { path = "crates/ferriscd-controller" }
ferriscd-server = { path = "crates/ferriscd-server" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# macOS: keep debug symbols in separate .o files instead of relinking one large
# object per binary. This is the platform default, but state it explicitly so a
# future `split-debuginfo` change elsewhere cannot silently reintroduce the
# per-link copy of hundreds of MB of DWARF.
[profile.dev]
split-debuginfo = "unpacked"

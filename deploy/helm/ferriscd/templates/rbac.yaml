{{- if .Values.rbac.create }}
{{- $saName := include "ferriscd.serviceAccountName" . }}
{{- $fullname := include "ferriscd.fullname" . }}
{{- $watchAllNamespaces := has "*" .Values.multiTenant.applicationNamespaces }}
# Control-plane namespace Role:
# Strictly scopes `secrets` (repository credentials and remote-cluster registrations),
# `configmaps` (`ferriscd-rbac-cm`), leader-election `leases`, control-plane `AppProject`s,
# `Application`s, and `events` to the control-plane namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ferriscd.labels" . | nindent 4 }}
rules:
  # Leader-election Lease (`T13.2`) and per-shard Leases (`T13.3`).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # Repository credentials (`ferriscd.io/secret-type=repository`, `T12.4`) and
  # remote-cluster registrations (`ferriscd.io/secret-type=cluster`, `T13.1`).
  # NEVER granted in the ClusterRole.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Project-scoped REST API RBAC ConfigMap (`ferriscd-rbac-cm`, `T14.4`).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Rate-limited Kubernetes Events attached to Applications (`T15.2`).
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "get", "list"]
  # Application and AppProject lifecycle in the control-plane namespace.
  - apiGroups: ["ferriscd.io"]
    resources: ["applications"]
    {{- if .Values.rbac.applicationsets }}
    # Opt-in `ApplicationSet` controller (`T19.3`, `--enable-applicationsets`): the generated
    # Applications are written with Server-Side Apply, which needs `patch` *and* `create`.
    {{- if .Values.rbac.applicationsetPrune }}
    # `delete` is a *separate* opt-in: it is only used by `spec.syncPolicy.prune: true` or
    # `preserveResourcesOnDeletion: false`, and it lets the loop delete generated Applications in
    # this namespace. Leave `rbac.applicationsetPrune` off unless an ApplicationSet sets one of them.
    verbs: ["get", "list", "watch", "patch", "create", "delete"]
    {{- else }}
    verbs: ["get", "list", "watch", "patch", "create"]
    {{- end }}
    {{- else }}
    verbs: ["get", "list", "watch", "patch"]
    {{- end }}
  - apiGroups: ["ferriscd.io"]
    resources: ["applications/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["ferriscd.io"]
    resources: ["applications/finalizers"]
    verbs: ["update"]
  - apiGroups: ["ferriscd.io"]
    resources: ["appprojects"]
    verbs: ["get", "list", "watch"]
  # `T17.4`: report an unusable `spec.syncWindows` entry as a `Ready=False`
  # (`reason=SyncWindowInvalid`) condition on the AppProject. `status` is a subresource, so this
  # cannot edit the project's spec.
  - apiGroups: ["ferriscd.io"]
    resources: ["appprojects/status"]
    verbs: ["get", "patch"]
  {{- if .Values.rbac.applicationsets }}
  # Opt-in `ApplicationSet` controller (`T19.3`). `patch` (not `update`) is what sets and clears
  # `metadata.finalizers` with a merge patch — the `finalizers` subresource is never used — and
  # `/status` is patched on every pass. Pair this with
  # `server.extraArgs: ["--enable-applicationsets"]`.
  - apiGroups: ["ferriscd.io"]
    resources: ["applicationsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["ferriscd.io"]
    resources: ["applicationsets/status"]
    verbs: ["get", "patch", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ferriscd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- if and (not $watchAllNamespaces) .Values.multiTenant.applicationNamespaces }}
{{- range $ns := .Values.multiTenant.applicationNamespaces }}
{{- if ne $ns $.Release.Namespace }}
---
# Least-privilege tenant-namespace Role (`T12.2`): grants Application lifecycle and
# event emission in an explicitly allowlisted tenant namespace without cluster-wide scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-tenant
  namespace: {{ $ns }}
  labels:
    {{- include "ferriscd.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["ferriscd.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["ferriscd.io"]
    resources: ["applications/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["ferriscd.io"]
    resources: ["applications/finalizers"]
    verbs: ["update"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-tenant
  namespace: {{ $ns }}
  labels:
    {{- include "ferriscd.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-tenant
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
---
# Least-privilege ClusterRole:
# Deliberately excludes `secrets` and `*/*` wildcards by default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ferriscd.labels" . | nindent 4 }}
rules:
  # Kubernetes TokenReview AuthN for `/api/v1/*` (`T14.3`).
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # CRD discovery (write verbs require explicit `rbac.manageCrds: true`).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    {{- if .Values.rbac.manageCrds }}
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
    {{- else }}
    verbs: ["get", "list", "watch"]
    {{- end }}
  {{- if $watchAllNamespaces }}
  # Cluster-wide Application watching enabled via `multiTenant.applicationNamespaces: ["*"]`.
  - apiGroups: ["ferriscd.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["ferriscd.io"]
    resources: ["applications/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["ferriscd.io"]
    resources: ["applications/finalizers"]
    verbs: ["update"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "get", "list"]
  {{- end }}
  {{- if .Values.rbac.impersonation.enabled }}
  # Opt-in ServiceAccount impersonation (`T12.3`). Controller refuses `system:masters`.
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]
  {{- end }}
  {{- if .Values.rbac.manageRbacResources }}
  # Opt-in RBAC resource reconciliation.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  {{- end }}
  {{- with .Values.rbac.workloadRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- if .Values.driftWatcher.enabled }}
  # Opt-in drift watcher (`T18.2`): the metadata watches are cluster-wide (`Api::all_with`), so the
  # read verbs must be granted here rather than per namespace. They are listed explicitly — and
  # separately from `rbac.workloadRules` — so that narrowing `workloadRules` cannot silently turn
  # every drift watch into a `403`. The requests are metadata-only
  # (`application/json;as=PartialObjectMetadata`) and label-scoped
  # (`ferriscd.io/managed-by=ferriscd`), so no `.spec`, `.status` or `Secret.data` is ever returned;
  # `secrets` stays excluded on purpose (the watcher never needs it and the ClusterRole must not
  # grant it). Keep this list in step with `driftWatcher.kinds`: a kind without a grant parks its
  # watch for 15 minutes and falls back to Model 1 polling, with one warning and
  # `ferriscd_drift_watcher_fallback_total{reason="forbidden"}`.
  - apiGroups: [""]
    resources:
      - configmaps
      - services
      - serviceaccounts
      - persistentvolumeclaims
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- with .Values.rbac.extraClusterRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ferriscd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- end }}

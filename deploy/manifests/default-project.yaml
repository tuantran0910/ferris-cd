# Canonical `default` AppProject.
#
# Every Application that does not name a project references this one, so it must exist
# before any Application can reconcile. It is intentionally permissive: it allows every
# source repository, every destination namespace, and every GroupKind, which reproduces the
# Phase 05–11 permissive behaviour now that `AppProjectPolicy` (T12.1) enforces projects.
#
# This is only appropriate for a single-tenant cluster. Before enabling
# Apps-in-any-namespace (Phase 12) replace it with least-privilege projects that narrow
# `sourceRepos`, `destinations`, `clusterResourceWhitelist`, `namespaceResourceWhitelist`,
# and `allowedServiceAccounts`.
#
# `allowedServiceAccounts: ["*"]` means "any ServiceAccount in the destination namespace may be
# impersonated". It is kept here because that is what "permissive single-tenant default" means
# (an Application that names a `serviceAccountName` must keep working out of the box), and it is
# bounded on the controller side: at most MAX_CACHED_IDENTITIES (64) impersonated clients are
# cached, so a tenant cannot grow controller memory by cycling ServiceAccount names, and the
# cascade path re-checks this list before it deletes anything. Narrow it to explicit
# `<destination-namespace>/<name>` entries before you share a cluster with anyone.
#
# `sourceNamespaces` is deliberately omitted: the schema default is `["ferriscd-system"]`,
# so widening it is always an explicit, reviewable change.
apiVersion: ferriscd.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: ferriscd-system
  labels:
    app.kubernetes.io/name: ferriscd
    app.kubernetes.io/component: appproject
    app.kubernetes.io/managed-by: ferriscd
spec:
  description: >-
    Default FerrisCD project used when an Application does not name a project.
    Permits every source repository, destination, GroupKind, and ServiceAccount;
    it is only appropriate for single-tenant clusters.
  sourceRepos:
    - "*"
  destinations:
    - cluster: in-cluster
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceBlacklist: []
  allowedServiceAccounts:
    - "*"

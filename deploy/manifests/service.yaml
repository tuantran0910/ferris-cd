apiVersion: v1
kind: Service
metadata:
  name: ferriscd
  namespace: ferriscd-system
  labels:
    app.kubernetes.io/name: ferriscd
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: ferriscd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ferriscd
    app.kubernetes.io/component: server
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

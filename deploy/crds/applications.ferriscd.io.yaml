# FerrisCD `Application` CRD (ferriscd.io/v1alpha1).
#
# Requires Kubernetes >= 1.29. `spec.source.oci` carries a CEL validation rule written with the
# optional-field syntax (`self.?tag.hasValue() || self.?digest.hasValue()`), which earlier API
# servers cannot compile: they reject this CRD at apply time instead of skipping the validation.
#
# Generated by `ferriscd crd generate`; edit `crates/ferriscd-crd/src/generate.rs`, not this file.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.ferriscd.io
spec:
  group: ferriscd.io
  names:
    kind: Application
    plural: applications
    shortNames:
    - app
    - apps
    singular: application
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Current sync status (Synced, OutOfSync, Unknown)
      jsonPath: .status.sync.status
      name: SYNC
      type: string
    - description: Aggregated health of the managed resources
      jsonPath: .status.health.status
      name: HEALTH
      type: string
    - description: Git revision currently deployed
      jsonPath: .status.sync.revision
      name: REVISION
      type: string
    - description: Age of the Application
      jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "Declarative GitOps application: render a Git source and sync it to a destination cluster namespace"
        properties:
          spec:
            description: |-
              `Application` custom resource (`ferriscd.io/v1alpha1`).

              The generated `CustomResourceDefinition` carries the `status` subresource plus the
              `SYNC` / `HEALTH` / `REVISION` / `AGE` printer columns.
            properties:
              destination:
                description: Target cluster and namespace.
                properties:
                  cluster:
                    default: in-cluster
                    description: "Target cluster: `in-cluster` or a FerrisCD cluster Secret name."
                    type: string
                  namespace:
                    description: Namespace injected onto namespaced resources that do not set one explicitly.
                    type: string
                required:
                - namespace
                type: object
              ignoreDifferences:
                default: []
                description: Field-level drift suppressions applied before diffing.
                items:
                  description: >-
                    Field-level drift suppression for one Group/Kind (optionally narrowed by
                    name/namespace).
                  properties:
                    group:
                      description: API group (`""` for the core group); omitted means "any group".
                      nullable: true
                      type: string
                    jsonPointers:
                      default: []
                      description: RFC 6901 JSON Pointers whose live/desired values are ignored during diffing.
                      items:
                        type: string
                      type: array
                    kind:
                      description: Kind the suppression applies to.
                      type: string
                    managedFieldsManagers:
                      default: []
                      description: Field managers whose owned fields are ignored during diffing.
                      items:
                        type: string
                      type: array
                    name:
                      description: Resource name the suppression applies to; omitted means "any name".
                      nullable: true
                      type: string
                    namespace:
                      description: Resource namespace the suppression applies to; omitted means "any namespace".
                      nullable: true
                      type: string
                  required:
                  - kind
                  type: object
                type: array
              project:
                default: default
                description: |-
                  `AppProject` this application belongs to; checked on every rendered resource.

                  Defaults to [`DEFAULT_PROJECT_NAME`].
                type: string
              requeueAfterSeconds:
                default: 180
                description: >-
                  Periodic reconcile interval in seconds (default
                  [`DEFAULT_REQUEUE_AFTER_SECONDS`]).
                format: uint32
                maximum: 86400.0
                minimum: 1.0
                type: integer
              revisionHistoryLimit:
                default: 10
                description: |-
                  Hard cap on `status.history` entries, validated to `1..=20`
                  (default [`DEFAULT_REVISION_HISTORY_LIMIT`]).
                format: int32
                maximum: 20.0
                minimum: 1.0
                type: integer
              serviceAccountName:
                description: |-
                  ServiceAccount (in the destination namespace) used for impersonation.

                  Only honored when the referenced `AppProject` lists it in `allowedServiceAccounts`.
                nullable: true
                type: string
              source:
                description: |-
                  Where the desired manifests come from and how they are rendered.

                  `T20.1` relaxed this from a required [`SourceSpec`] to `Option<SourceSpec>` so a
                  multi-source `Application` can declare [`Self::sources`] instead. The two are **mutually
                  exclusive**, enforced by the injected CEL rule ([`crate::generate::SOURCE_DECLARATION_RULE`])
                  and by [`Self::validate`] with identical verdicts. Everything a `v1.0` client writes is
                  unaffected: `source` is still serialized exactly where it always was, and a Git application
                  never gains a `sources` key.
                nullable: true
                properties:
                  git:
                    description: Git repository, revision, and manifest sub-path. Mutually exclusive with `oci`.
                    nullable: true
                    properties:
                      path:
                        default: ""
                        description: Relative sub-directory inside the repository (`""` means repository root).
                        type: string
                      repoURL:
                        description: >-
                          Repository clone URL (`https://`, `ssh://`, SCP-style SSH, or a local test
                          path).
                        type: string
                      targetRevision:
                        default: HEAD
                        description: Branch, tag, `HEAD`, or full 40-character commit SHA.
                        type: string
                    required:
                    - repoURL
                    type: object
                  oci:
                    description: >-
                      OCI artifact (Helm chart or Kustomize/manifest bundle). Mutually exclusive with
                      `git`.
                    nullable: true
                    properties:
                      digest:
                        description: |-
                          Immutable manifest digest (`sha256:<64 lowercase hex>`).

                          When both `tag` and `digest` are set the resolved manifest must match `digest`.
                        nullable: true
                        type: string
                      path:
                        default: ""
                        description: >-
                          Relative sub-directory inside the extracted artifact (`""` means the artifact
                          root).
                        type: string
                      tag:
                        description: "Tag to resolve (a plain tag, never a SemVer range: resolution stays a digest lookup)."
                        nullable: true
                        type: string
                      url:
                        description: "Artifact reference: `oci://<registry>/<repository>` (HTTPS-only registry transport)."
                        type: string
                    required:
                    - url
                    type: object
                    x-kubernetes-validations:
                    - message: at least one of spec.source.oci.tag or spec.source.oci.digest must be specified
                      rule: self.?tag.hasValue() || self.?digest.hasValue()
                  renderer:
                    default:
                      auto: {}
                    description: Renderer used to turn the checked-out path into Kubernetes manifests.
                    oneOf:
                    - required:
                      - auto
                    - required:
                      - plainYaml
                    - required:
                      - kustomize
                    - required:
                      - helm
                    properties:
                      auto:
                        description: Automatic renderer detection based on the files present in the source path.
                        type: object
                      helm:
                        description: Helm chart rendering (CRDs are not installed unless `includeCRDs` is set).
                        properties:
                          includeCRDs:
                            default: false
                            description: Install CRDs shipped in the chart's `crds/` directory (default `false`).
                            type: boolean
                          releaseName:
                            description: Release name used for rendering; defaults to the `Application` name.
                            nullable: true
                            type: string
                          valueFiles:
                            default: []
                            description: |-
                              Additional values files, relative to the source path (`spec.source.git.path` /
                              `spec.source.oci.path`).
                            items:
                              type: string
                            type: array
                        type: object
                      kustomize:
                        description: Kustomize overlay (remote resources are rejected).
                        properties:
                          images:
                            default: []
                            description: Image overrides applied to the rendered output (`name=newImage:tag`).
                            items:
                              type: string
                            type: array
                          kustomizationPath:
                            description: |-
                              Overlay directory (relative to the source path (`spec.source.git.path` /
                              `spec.source.oci.path`)); defaults to the source path.
                            nullable: true
                            type: string
                        type: object
                      plainYaml:
                        description: Literal multi-document YAML/JSON manifests.
                        properties:
                          recursive:
                            default: true
                            description: |-
                              Recurse into sub-directories of the source path (`spec.source.git.path` /
                              `spec.source.oci.path`) (default `true`).
                            type: boolean
                        type: object
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of spec.source.git or spec.source.oci must be specified
                  rule: >-
                    (has(self.git) && self.git != null && !(has(self.oci) && self.oci != null)) ||
                    (!(has(self.git) && self.git != null) && has(self.oci) && self.oci != null)
              sources:
                description: |-
                  Additional sources for a split chart/values layout (`T20.1`).

                  Each entry is an independent Git repository or OCI artifact. An entry that declares a
                  `renderer` contributes manifests; one that does not is a **values-only** source that can be
                  referenced by an aliased sibling (`ref: values` → `$values/envs/prod/values.yaml`).

                  Capped at [`MAX_SOURCES`] so a single `Application` cannot fan out an unbounded number of
                  checkouts or overflow the `etcd` object limit with per-source revisions.
                items:
                  description: |-
                    One entry of `spec.sources` (`T20.1`).

                    Carries exactly one of `git`/`oci` (the mirrored CEL rule and
                    [`ApplicationSpec::validate`] both refuse neither-set and both-set), an **optional**
                    `renderer`, and an optional `ref` alias.

                    * An entry that declares a `renderer` is **rendered** and contributes its manifests to the
                      bundle.
                    * An entry without a `renderer` is a **support source**: it is still fetched into its own
                      isolated, sanitized worktree (so its revision is tracked and its content can be referenced),
                      but it contributes no manifests of its own. A Helm sibling addresses its files through the
                      alias: `valueFiles: [$values/envs/prod/values.yaml]`.
                    * When *no* entry declares a `renderer`, the first entry is rendered with the default
                      (`renderer.auto`), which makes a one-entry `spec.sources` behave exactly like the equivalent
                      `spec.source`.
                  properties:
                    git:
                      description: Git repository, revision, and manifest sub-path. Mutually exclusive with `oci`.
                      nullable: true
                      properties:
                        path:
                          default: ""
                          description: Relative sub-directory inside the repository (`""` means repository root).
                          type: string
                        repoURL:
                          description: >-
                            Repository clone URL (`https://`, `ssh://`, SCP-style SSH, or a local test
                            path).
                          type: string
                        targetRevision:
                          default: HEAD
                          description: Branch, tag, `HEAD`, or full 40-character commit SHA.
                          type: string
                      required:
                      - repoURL
                      type: object
                    oci:
                      description: OCI artifact (Helm chart or manifest bundle). Mutually exclusive with `git`.
                      nullable: true
                      properties:
                        digest:
                          description: |-
                            Immutable manifest digest (`sha256:<64 lowercase hex>`).

                            When both `tag` and `digest` are set the resolved manifest must match `digest`.
                          nullable: true
                          type: string
                        path:
                          default: ""
                          description: >-
                            Relative sub-directory inside the extracted artifact (`""` means the artifact
                            root).
                          type: string
                        tag:
                          description: "Tag to resolve (a plain tag, never a SemVer range: resolution stays a digest lookup)."
                          nullable: true
                          type: string
                        url:
                          description: "Artifact reference: `oci://<registry>/<repository>` (HTTPS-only registry transport)."
                          type: string
                      required:
                      - url
                      type: object
                    ref:
                      description: |-
                        Alias other sources use to reference this one (`$<ref>/<path>`, e.g. `ref: values`).

                        Must be a DNS-1123 label and unique within `spec.sources`;
                        [`ApplicationSpec::validate`] rejects anything else so `$values/...` can never be ambiguous.
                        That check is offline-only — the CRD schema carries no CEL rule or `pattern` for it (see
                        [`validate_source_ref`]) — so the CLI and the controller are what enforce it, before any
                        source is fetched.
                      nullable: true
                      type: string
                    renderer:
                      description: >-
                        Renderer for this entry. Omitted means "support source only" (see the type
                        docs).
                      nullable: true
                      oneOf:
                      - required:
                        - auto
                      - required:
                        - plainYaml
                      - required:
                        - kustomize
                      - required:
                        - helm
                      properties:
                        auto:
                          description: Automatic renderer detection based on the files present in the source path.
                          type: object
                        helm:
                          description: Helm chart rendering (CRDs are not installed unless `includeCRDs` is set).
                          properties:
                            includeCRDs:
                              default: false
                              description: Install CRDs shipped in the chart's `crds/` directory (default `false`).
                              type: boolean
                            releaseName:
                              description: Release name used for rendering; defaults to the `Application` name.
                              nullable: true
                              type: string
                            valueFiles:
                              default: []
                              description: |-
                                Additional values files, relative to the source path (`spec.source.git.path` /
                                `spec.source.oci.path`).
                              items:
                                type: string
                              type: array
                          type: object
                        kustomize:
                          description: Kustomize overlay (remote resources are rejected).
                          properties:
                            images:
                              default: []
                              description: Image overrides applied to the rendered output (`name=newImage:tag`).
                              items:
                                type: string
                              type: array
                            kustomizationPath:
                              description: |-
                                Overlay directory (relative to the source path (`spec.source.git.path` /
                                `spec.source.oci.path`)); defaults to the source path.
                              nullable: true
                              type: string
                          type: object
                        plainYaml:
                          description: Literal multi-document YAML/JSON manifests.
                          properties:
                            recursive:
                              default: true
                              description: |-
                                Recurse into sub-directories of the source path (`spec.source.git.path` /
                                `spec.source.oci.path`) (default `true`).
                              type: boolean
                          type: object
                      type: object
                  type: object
                maxItems: 16
                type: array
              syncPolicy:
                description: |-
                  Automated sync policy, sync options, and retry behaviour.

                  Omitted entirely for manual-only sync.
                nullable: true
                properties:
                  automated:
                    description: |-
                      Automated sync policy.

                      `None` means manual-only sync. Because this is an `Option` of a struct, the
                      invalid combination `automated: false` + `selfHeal: true` cannot be expressed.
                    nullable: true
                    properties:
                      prune:
                        default: false
                        description: >-
                          Prune resources removed from Git (never CRDs/Namespaces unless explicitly opted
                          in).
                        type: boolean
                      selfHeal:
                        default: false
                        description: Re-apply live drift automatically.
                        type: boolean
                    type: object
                  metricGates:
                    description: |-
                      Opt-in Prometheus metric gates that guard promotion **between** sync waves (`T20.3`).

                      An entry holds the rollout after wave `afterWave` until `count` consecutive evaluations of
                      `query` satisfy `successCondition`. A gate can only name a provider that a cluster
                      administrator allowlisted in `ConfigMap/ferriscd-metrics-providers-cm`: the endpoint itself
                      is never part of `ApplicationSpec`, so a tenant cannot make the controller dial an arbitrary
                      URL (the `T20.3` SSRF trap guard).

                      Additive on the wire: absent (never `[]`) when no gate is configured, so every stored
                      `v1alpha1` object round-trips byte-identically.
                    items:
                      description: |-
                        One metric gate guarding promotion *after* a sync wave (`T20.3`).

                        # Why there is no `prometheusUrl` field

                        The roadmap spells the field as `prometheusUrl`, "referenced via the control-plane allowlisted
                        `ConfigMap/ferriscd-metrics-providers-cm`". That reference is modelled as an opaque **provider
                        name** instead of a URL: `provider` is a key of that `ConfigMap`, and the controller resolves it
                        there, one scoped read per reconcile. An arbitrary URL is therefore not representable in
                        `ApplicationSpec` at all — the strongest possible form of the SSRF guard, since there is no field
                        whose validation could be bypassed. `ApplicationSpec::validate` additionally rejects a value that
                        looks like a URL (`scheme://...`) with an explicit message, so a tenant who copies a URL from a
                        dashboard gets a terminal, actionable error instead of a gate that silently never resolves.
                      properties:
                        afterWave:
                          description: |-
                            Sync wave this gate guards: promotion **off** this wave (to the next one) waits for the gate.

                            Matched against the rendered `ferriscd.io/sync-wave` numbers. A gate **on the last wave of a
                            bundle is still gated** (`T20.3` finding M5): declaring any gate puts the operation state
                            machine in charge of the rollout, so the gate guards the promotion out of that wave — to
                            `PostSync`, and with it to the prune and to `Synced`. A single-wave bundle is therefore *not*
                            ungated; it is gated on the only boundary it has.

                            A gate naming a wave the bundle never renders cannot fire, because there is no boundary after
                            it. The controller never treats that as a bypass: it logs a `Warning` naming the gate on every
                            pass that renders a bundle the gate does not match, so the mistake is visible instead of
                            silent.
                          format: int32
                          type: integer
                        count:
                          default: 1
                          description: |-
                            How many consecutive passing samples promote the rollout (default
                            [`DEFAULT_METRIC_GATE_COUNT`]).
                          format: uint32
                          maximum: 10.0
                          minimum: 1.0
                          type: integer
                        failureAction:
                          default: Pause
                          description: What a failing sample does (default [`MetricGateFailureAction::Pause`]).
                          enum:
                          - Pause
                          - Rollback
                          type: string
                        intervalSeconds:
                          default: 30
                          description: |-
                            How long to wait between two samples (default [`DEFAULT_METRIC_GATE_INTERVAL_SECONDS`]).

                            The wait is always a requeue: no reconcile worker ever sleeps on a bake window.
                          format: uint32
                          maximum: 3600.0
                          minimum: 1.0
                          type: integer
                        provider:
                          description: |-
                            Key of `ConfigMap/ferriscd-metrics-providers-cm` naming the Prometheus provider to query.

                            Never a URL: the endpoint is configured exclusively by a cluster administrator in the
                            control-plane namespace (`T20.3` trap guard).
                          type: string
                        query:
                          description: >-
                            PromQL query returning the measurement the gate judges (an instant vector or
                            scalar).
                          type: string
                        successCondition:
                          description: >-
                            Condition the measurement must satisfy, e.g. `result[0] < 0.01` or `len(result)
                            > 0`.
                          type: string
                      required:
                      - afterWave
                      - provider
                      - query
                      - successCondition
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-validations:
                    - message: each spec.syncPolicy.metricGates entry must guard a distinct afterWave
                      rule: self.all(g, size(self.filter(h, h.afterWave == g.afterWave)) == 1)
                    - message: >-
                        spec.syncPolicy.metricGates[].provider must name an admin-allowlisted
                        Prometheus provider of ConfigMap/ferriscd-metrics-providers-cm, never a URL
                      rule: self.all(g, !g.provider.contains('://'))
                  retry:
                    description: Bounded retry policy for failed sync operations.
                    nullable: true
                    properties:
                      backoff:
                        description: Exponential backoff parameters.
                        nullable: true
                        properties:
                          durationSeconds:
                            default: 5
                            description: Initial backoff duration in seconds.
                            format: uint32
                            minimum: 0.0
                            type: integer
                          factor:
                            default: 2
                            description: Multiplier applied after every failed attempt.
                            format: uint32
                            minimum: 0.0
                            type: integer
                          maxDurationSeconds:
                            default: 180
                            description: Upper bound for a single backoff duration in seconds.
                            format: uint32
                            minimum: 0.0
                            type: integer
                        type: object
                      limit:
                        default: 5
                        description: Maximum number of retry attempts (default [`DEFAULT_RETRY_LIMIT`]).
                        format: uint32
                        minimum: 0.0
                        type: integer
                    type: object
                  syncOptions:
                    description: "Sync options applied to every sync (safe defaults: no forced apply, no CRD/namespace pruning)."
                    nullable: true
                    properties:
                      applyOutOfSyncOnly:
                        default: true
                        description: Only apply resources that are actually out of sync (default `true`).
                        type: boolean
                      createNamespace:
                        default: false
                        description: Create `spec.destination.namespace` when it does not exist.
                        type: boolean
                      pruneCRDs:
                        default: false
                        description: "Allow pruning `CustomResourceDefinition` objects (safety rail: default `false`)."
                        type: boolean
                      pruneLast:
                        default: true
                        description: Apply pruning last, after every other resource converged.
                        type: boolean
                      pruneNamespaces:
                        default: false
                        description: "Allow pruning `Namespace` objects (safety rail: default `false`)."
                        type: boolean
                      serverSideForce:
                        default: false
                        description: "Send `force: true` in Server-Side Apply patches (default `false`)."
                        type: boolean
                      takeoverFieldManagers:
                        default: []
                        description: Field managers whose ownership FerrisCD may take over (brownfield adoption).
                        items:
                          type: string
                        type: array
                    type: object
                type: object
            required:
            - destination
            type: object
            x-kubernetes-validations:
            - message: exactly one of spec.source or spec.sources must be specified
              rule: >-
                (has(self.source) && self.source != null && !(self.?sources.hasValue() &&
                size(self.sources) > 0)) || (!(has(self.source) && self.source != null) &&
                self.?sources.hasValue() && size(self.sources) > 0)
            - message: spec.sources must contain at most 16 entries
              rule: "!self.?sources.hasValue() || size(self.sources) <= 16"
            - message: each spec.sources entry must set exactly one of git or oci
              rule: "!self.?sources.hasValue() || self.sources.all(s, (has(s.git) && s.git != null && !(has(s.oci) && s.oci != null)) || (!(has(s.git) && s.git != null) && has(s.oci) && s.oci != null))"
          status:
            description: "`Application` `/status` subresource."
            nullable: true
            properties:
              conditions:
                description: Standard conditions (`Ready`, ...).
                items:
                  description: |-
                    Wire-compatible mirror of `metav1.Condition`.

                    Field names and values match the Kubernetes API so `kubectl wait --for=condition=Ready`
                    and `kubectl describe` behave exactly as for built-in resources.
                  properties:
                    lastTransitionTime:
                      description: When `status` last changed. Preserved while `status` is unchanged.
                      format: date-time
                      type: string
                    message:
                      default: ""
                      description: >-
                        Human-readable message; always present on the wire for `metav1.Condition`
                        parity.
                      type: string
                    observedGeneration:
                      description: "`metadata.generation` observed when the condition was computed."
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: CamelCase machine-readable reason for the current status.
                      type: string
                    status:
                      description: Whether the condition currently holds.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type (e.g. [`CONDITION_READY`]).
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              health:
                description: Aggregated health.
                nullable: true
                properties:
                  message:
                    description: Short human-readable explanation (never contains secret values).
                    nullable: true
                    type: string
                  status:
                    description: Aggregated health status.
                    enum:
                    - Healthy
                    - Progressing
                    - Degraded
                    - Suspended
                    - Missing
                    - Unknown
                    type: string
                required:
                - status
                type: object
              history:
                description: Bounded deployment history (newest first, at most [`MAX_HISTORY_ENTRIES`]).
                items:
                  description: Metadata-only deployment history entry (never stores manifest content).
                  properties:
                    deployedAt:
                      description: When the revision was deployed.
                      format: date-time
                      type: string
                    id:
                      description: Monotonic deployment id.
                      format: int64
                      type: integer
                    revision:
                      description: Revision (commit SHA) that was deployed.
                      nullable: true
                      type: string
                    revisions:
                      description: |-
                        Resolved revision of every declared source for a multi-source `Application` (`T20.1`).

                        `revision` stays the (composite) deployment identity the rollback path pins — this list is
                        what a rollback needs to re-deploy *the same* per-source revisions, and what an operator
                        reads to see which values repository produced a deployment. Absent for a single-source
                        entry, so `v1.0` history entries are unchanged.
                      items:
                        type: string
                      type: array
                    sourceSummary:
                      description: |-
                        Which source (repository, path, renderer, requested revision) produced that commit.

                        Metadata only: it never carries rendered manifests. Recording it makes a history entry
                        self-describing, so "what was deployed" survives an `Application` spec edit that has since
                        moved to another path or renderer.
                      nullable: true
                      properties:
                        path:
                          description: Manifest sub-path inside the repository (`""` means the repository root).
                          type: string
                        renderer:
                          default:
                            auto: {}
                          description: Renderer that turned the path into manifests (`spec.source.renderer`).
                          oneOf:
                          - required:
                            - auto
                          - required:
                            - plainYaml
                          - required:
                            - kustomize
                          - required:
                            - helm
                          properties:
                            auto:
                              description: Automatic renderer detection based on the files present in the source path.
                              type: object
                            helm:
                              description: Helm chart rendering (CRDs are not installed unless `includeCRDs` is set).
                              properties:
                                includeCRDs:
                                  default: false
                                  description: Install CRDs shipped in the chart's `crds/` directory (default `false`).
                                  type: boolean
                                releaseName:
                                  description: Release name used for rendering; defaults to the `Application` name.
                                  nullable: true
                                  type: string
                                valueFiles:
                                  default: []
                                  description: |-
                                    Additional values files, relative to the source path (`spec.source.git.path` /
                                    `spec.source.oci.path`).
                                  items:
                                    type: string
                                  type: array
                              type: object
                            kustomize:
                              description: Kustomize overlay (remote resources are rejected).
                              properties:
                                images:
                                  default: []
                                  description: Image overrides applied to the rendered output (`name=newImage:tag`).
                                  items:
                                    type: string
                                  type: array
                                kustomizationPath:
                                  description: |-
                                    Overlay directory (relative to the source path (`spec.source.git.path` /
                                    `spec.source.oci.path`)); defaults to the source path.
                                  nullable: true
                                  type: string
                              type: object
                            plainYaml:
                              description: Literal multi-document YAML/JSON manifests.
                              properties:
                                recursive:
                                  default: true
                                  description: |-
                                    Recurse into sub-directories of the source path (`spec.source.git.path` /
                                    `spec.source.oci.path`) (default `true`).
                                  type: boolean
                              type: object
                          type: object
                        repoURL:
                          description: Repository/registry URL, as recorded by the controller (credential-free).
                          type: string
                        targetRevision:
                          default: HEAD
                          description: Branch, tag, `HEAD`, or commit SHA the sync was requested for.
                          type: string
                      type: object
                  required:
                  - deployedAt
                  - id
                  type: object
                type: array
              inventory:
                description: >-
                  Crash-safe, version-agnostic inventory of every resource owned by this
                  application.
                items:
                  description: |-
                    Version-agnostic inventory entry keyed by GKNN (`<group>/<kind>/<namespace>/<name>`),
                    with the API version stored separately as a non-key hint.

                    Keying on Group/Kind/Namespace/Name only is what prevents an API version upgrade
                    (`v1beta1` -> `v1`) from turning the live object into an orphan and self-pruning it
                    (review finding C2 / ADR-003).
                  properties:
                    key:
                      description: |-
                        Canonical GKNN string: `<group>/<kind>/<namespace>/<name>` (empty namespace for
                        cluster-scoped resources, empty group for the core group). Never contains a version.
                      type: string
                    version:
                      default: ""
                      description: API version hint (`v1`, `apps/v1`, ...). Not part of resource identity.
                      type: string
                  required:
                  - key
                  type: object
                type: array
              observedGeneration:
                description: "`metadata.generation` observed by the last reconcile."
                format: int64
                nullable: true
                type: integer
              operationState:
                description: Persisted operation state (multi-wave / hook / rollback progress).
                nullable: true
                properties:
                  activeHooks:
                    description: |-
                      Hooks this operation has created and must keep tracking (`T10.3`, finding H2).

                      Hooks are **never** part of `status.inventory`; this list is the operation-scoped tracking
                      record that lets a requeue observe a `generateName` hook instead of creating a duplicate.
                      It is bounded by [`MAX_ACTIVE_HOOKS`] and additive on the wire (`[]`/absent in older states).
                    items:
                      description: |-
                        A lifecycle hook created by the running operation (`T10.3`, finding H2).

                        A hook carrying `metadata.generateName` only learns its name from the API server, and
                        `generateName` hooks are **not** unique by Group/Kind/Namespace/Name (two `migrate-` Jobs of the
                        same kind in the same namespace are different objects). The hook is therefore identified by a
                        stable `hookId` derived from the rendered source (`<source file>#<ordinal>`, see
                        `ferriscd_engine::graph::hooks`), and the created object's `generatedName` is recorded next to
                        it: that is what lets the next requeue observe the exact `Job` instead of creating a second one.
                      properties:
                        generatedName:
                          default: ""
                          description: "Name of the created object (for a `generateName` hook: the name the API server generated)."
                          type: string
                        health:
                          default: Unknown
                          description: Health last observed for the created hook object.
                          enum:
                          - Healthy
                          - Progressing
                          - Degraded
                          - Suspended
                          - Missing
                          - Unknown
                          type: string
                        hookId:
                          description: Stable identity of the rendered hook resource (`<source file>#<ordinal>`).
                          type: string
                        phase:
                          description: Phase the hook runs in.
                          enum:
                          - PreSync
                          - Sync
                          - PostSync
                          - Succeeded
                          - SyncFail
                          - Failed
                          type: string
                        wave:
                          default: 0
                          description: Wave the hook is ordered in (`0` when it carries no `ferriscd.io/sync-wave`).
                          format: int32
                          type: integer
                      required:
                      - hookId
                      - phase
                      type: object
                    type: array
                  currentWave:
                    default: 0
                    description: Sync wave currently being applied (default `0`).
                    format: int32
                    type: integer
                  finishedAt:
                    description: When the operation finished (`None` while `phase` is `Running`).
                    format: date-time
                    nullable: true
                    type: string
                  message:
                    description: Bounded human-readable progress/error message.
                    nullable: true
                    type: string
                  metricGate:
                    description: |-
                      Progress of the metric gate holding this operation between waves (`T20.3`).

                      Additive on the wire: `None` for every operation that does not use
                      `spec.syncPolicy.metricGates`, so a `v1.0`-shaped `operationState` round-trips byte-identically
                      and a state written before Phase 20 still deserializes.
                    nullable: true
                    properties:
                      afterWave:
                        default: 0
                        description: The wave this gate guards promotion off.
                        format: int32
                        type: integer
                      consecutiveErrors:
                        default: 0
                        description: |-
                          How many consecutive **query** failures have been recorded since the last usable sample.

                          A provider that cannot be queried must not hold a rollout open forever, so the controller
                          fails the gate closed after a bounded number of these.
                        format: uint32
                        minimum: 0.0
                        type: integer
                      consecutiveSuccesses:
                        default: 0
                        description: How many consecutive passing samples have been recorded.
                        format: uint32
                        minimum: 0.0
                        type: integer
                      failureAction:
                        default: Pause
                        description: |-
                          The action this gate decided on when it failed (`T20.3` finding M4).

                          Recorded instead of re-derived from `spec`, because the two are deliberately **not** the same
                          value: a measurement breach honours `failureAction`, while a gate that could not be *evaluated*
                          (an unparsable `successCondition`, a `4xx`, a non-JSON body, an unsupported result type)
                          always pauses — a broken query is not evidence that the rollout regressed, so it must never
                          trigger an automatic rollback. Persisting the decision is what keeps a resumed `Failed`
                          verdict (a controller restart, or a re-plan of the same operating state) honest.

                          Additive on the wire: absent reads as `Pause`, the safe direction.
                        enum:
                        - Pause
                        - Rollback
                        type: string
                      fingerprint:
                        description: |-
                          Stable identity of the gate that produced this state.

                          A truncated SHA-256 over the gate's decision inputs (wave, provider, query, condition, count),
                          computed by the controller. A spec edit that changes any of them makes the persisted progress
                          unusable, and the controller restarts the bake instead of crediting samples taken under
                          different rules.
                        type: string
                      gatePhase:
                        default: Pending
                        description: |-
                          Where the gate is in its lifecycle.

                          `default` is load-bearing on the wire (`T20.3` finding M7): a `/status` that omits the field
                          — hand-patched by an operator, written by an older build, or produced by a tool that only
                          touches the documented top-level phase — would otherwise fail to deserialize the *whole*
                          `operationState`, and an operation state this controller cannot read is a rollout it cannot
                          resume. An absent phase reads as [`MetricGatePhase::Pending`], which is exactly "no sample
                          has been taken yet".
                        enum:
                        - Pending
                        - Sampling
                        - Passed
                        - Failed
                        type: string
                      lastCheckedAt:
                        description: When the last sample (or sample attempt) was taken.
                        format: date-time
                        nullable: true
                        type: string
                      message:
                        description: >-
                          Bounded, secret-free explanation (the failing measurement, the provider error
                          class).
                        nullable: true
                        type: string
                      requiredSuccesses:
                        default: 0
                        description: |-
                          How many consecutive passing samples are required (the spec's `count`, captured at the first
                          sample so an operator can see the progress as `1/3`).
                        format: uint32
                        minimum: 0.0
                        type: integer
                    required:
                    - fingerprint
                    type: object
                  phase:
                    description: Current phase.
                    enum:
                    - Running
                    - Succeeded
                    - Failed
                    - Error
                    type: string
                  phaseStartedAt:
                    description: |-
                      When the current sync phase/wave was dispatched.

                      This is the base of the per-wave timeout: a slow wave must be measured from the moment it
                      started, not from the start of the whole operation (`T10.1`).
                    format: date-time
                    nullable: true
                    type: string
                  revision:
                    description: Revision being operated on.
                    nullable: true
                    type: string
                  startedAt:
                    description: |-
                      When the operation started.

                      `T17.4`: this clock is paused by a blocked sync window. A pass that `spec.syncWindows`
                      denies leaves the operation `Running` but moves `startedAt` (and `phaseStartedAt`) to that
                      pass's own `now`, so a change freeze never counts against the operation/wave timeouts: the
                      resumed operation gets its full budget measured from the moment the window lifted.
                    format: date-time
                    type: string
                  syncPhase:
                    description: |-
                      Phase of a multi-wave sync operation (`T10.1`).

                      `PreSync` -> `Sync(wave)` -> `PostSync` -> `Succeeded`, with any wave (or the whole operation)
                      able to enter `SyncFail` -> `Failed`. The wave being applied is `currentWave`; this enum names
                      only the phase, so the wire form stays a flat string (no tagged-union schema) and
                      `kubectl get -o yaml` stays readable. The transition rules live in
                      `ferriscd_engine::sync::state_machine`; this type only fixes the wire values.
                    enum:
                    - PreSync
                    - Sync
                    - PostSync
                    - Succeeded
                    - SyncFail
                    - Failed
                    nullable: true
                    type: string
                required:
                - phase
                - startedAt
                type: object
              resources:
                description: Bounded per-resource health summaries (at most [`MAX_RESOURCE_STATUSES`]).
                items:
                  description: Bounded per-resource status summary.
                  properties:
                    health:
                      description: Health of this single resource.
                      enum:
                      - Healthy
                      - Progressing
                      - Degraded
                      - Suspended
                      - Missing
                      - Unknown
                      type: string
                    key:
                      description: GKNN key of the resource (same shape as [`InventoryEntry::key`]).
                      type: string
                    message:
                      default: ""
                      description: Bounded human-readable message (truncated to [`MAX_STATUS_MESSAGE_CHARS`]).
                      type: string
                    version:
                      default: ""
                      description: API version hint of the resource.
                      type: string
                  required:
                  - health
                  - key
                  type: object
                type: array
              resourcesOmitted:
                description: Number of per-resource summaries dropped because of [`MAX_RESOURCE_STATUSES`].
                format: uint32
                minimum: 0.0
                type: integer
              sync:
                description: Sync observability.
                nullable: true
                properties:
                  lastSyncedAt:
                    description: When the last successful sync finished.
                    format: date-time
                    nullable: true
                    type: string
                  lastSyncedRevision:
                    description: Last revision that was successfully synced.
                    nullable: true
                    type: string
                  lastSyncedSpecHash:
                    description: |-
                      Hash of `spec.source` at the last successful sync.

                      Guards `selfHeal: false` against spec edits that do not produce a new commit
                      (finding H7).
                    nullable: true
                    type: string
                  revision:
                    description: Revision (commit SHA) currently deployed.
                    nullable: true
                    type: string
                  revisions:
                    description: |-
                      Resolved revision of **every** declared source, in `spec.sources` declaration order
                      (`T20.1`).

                      A single-source `Application` leaves this empty and keeps reporting its one revision through
                      [`Self::revision`] exactly as `v1.0` did (trap guard `T20.1`). A multi-source `Application`
                      reports one entry per source, which is what makes "the values repo moved, the chart did not"
                      visible: [`Self::revision`] is then the composite digest over this list.

                      Additive on the wire: absent (never `[]`) for a single-source `Application`, so stored
                      objects round-trip byte-identically.
                    items:
                      type: string
                    type: array
                  status:
                    description: Current sync status.
                    enum:
                    - Synced
                    - OutOfSync
                    - Unknown
                    type: string
                required:
                - status
                type: object
            type: object
        required:
        - spec
        title: Application
        type: object
    served: true
    storage: true
    subresources:
      status: {}

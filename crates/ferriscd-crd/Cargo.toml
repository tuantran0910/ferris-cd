[package]
name = "ferriscd-crd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Kubernetes Custom Resource Definitions and status schemas for FerrisCD"

[lints]
workspace = true

[dependencies]
# `T17.4`: IANA time zones for `AppProject.spec.syncWindows` (the workspace dependency enables the
# bundled tzdb; `k8s-openapi` re-exports the same `jiff`, but with no database configured).
jiff.workspace = true
# NOTE: never enable a `k8s-openapi` version feature here; the binary crate decides.
k8s-openapi.workspace = true
kube.workspace = true
schemars.workspace = true
# YAML (de)serialization for CRD manifest generation and spec round-trip tests.
serde-saphyr.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The test target needs a Kubernetes version feature for the `Application`/`AppProject` types, and
# a library crate must not enable one for its consumers (ADR-002 §3) — the same dev-dependency-only
# arrangement `ferriscd-server` uses. `serde-saphyr`/`serde_json` are deliberately **not** repeated
# here: they are normal dependencies of this crate, so the test target already links them.
k8s-openapi = { workspace = true, features = ["v1_35"] }

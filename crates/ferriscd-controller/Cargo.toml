[package]
name = "ferriscd-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Kubernetes controller runtime, watch predicates, discovery cache, and leader election for FerrisCD"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# `T15.1`: the dedicated `/metrics` listener. `axum`/`hyper` are already in the lock file (the API
# server uses them), so serving the scrape endpoint here adds no package — and it has to live in
# this crate because `ferriscd controller` (no API server) serves it too.
axum.workspace = true
# The `T13.1` cluster registry (`DashMap<ClusterName, Arc<ClusterHandle>>`) and the `T13.2`
# leader-lease cancellation token. Both are already in the lock file.
dashmap.workspace = true
tokio-util.workspace = true
# Base64-encodes the CA/client-certificate material of a cluster `Secret` into the kubeconfig
# `*-data` fields kube's own loader expects (already a transitive dependency).
base64.workspace = true
# Parses the kubeconfig a `ferriscd.io/secret-type=cluster` Secret may carry. Reusing the YAML 1.2
# parser means kube's own loader validates the document (and we avoid a direct `secrecy` dependency
# for constructing `AuthInfo` by hand). Already in the lock file.
serde-saphyr.workspace = true
ferriscd-crd.workspace = true
ferriscd-engine.workspace = true
# Stream combinators for driving `kube_runtime::Controller` and boxing the
# pipeline/status-writer seams.
futures.workspace = true
# `T17.2`: OS CSPRNG for audit `eventId` UUIDv4 generation (already in Cargo.lock).
getrandom.workspace = true
# `T17.2`: optional async batched HTTPS audit webhook sink (already in workspace deps).
reqwest.workspace = true
serde.workspace = true
# `T12.3`: the `Impersonate-User`/`Impersonate-Group` tower layer, and the ONE shared hyper
# connector every impersonated `kube::Client` is built over (no per-reconcile connector).
http.workspace = true
hyper-timeout.workspace = true
hyper-util.workspace = true
# Process-level `rustls` `CryptoProvider` pinning (see `impersonation::ensure_crypto_provider`).
rustls.workspace = true
tower.workspace = true
k8s-openapi = { workspace = true, features = ["v1_35"] }
# `unstable-runtime` is required for `Controller::for_stream`, the only kube 5.1 API
# that accepts a pre-filtered watch stream. Without it the composite watch predicate
# (T05.2) could only be applied *after* a reconcile had already been enqueued.
kube = { workspace = true, features = ["unstable-runtime"] }
# Merge-patch bodies for the always-update-status wrapper.
serde_json.workspace = true
# `T15.1`: the metric families, their typed label sets, and the text (0.0.4) exposition.
prometheus-client.workspace = true
# `T15.2`: optional OpenTelemetry OTLP tracing layer (no-op unless `OTEL_EXPORTER_OTLP_ENDPOINT`
# is set).
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `test-utils` exposes the deterministic `FakeGitClient`, so the wired `v0.2` pipeline is
# exercised end to end (Git -> manifests -> scope -> live state -> apply) without a cluster
# and without ever invoking `git`.
ferriscd-engine = { workspace = true, features = ["test-utils"] }
# YAML parsing for the `AppProject` fixtures (the shipped `default` project manifest is parsed
# verbatim, so the policy tests cannot drift from what operators apply).
serde-saphyr.workspace = true
# Scratch directories for the fake Git work root and the repo cache.
tempfile.workspace = true

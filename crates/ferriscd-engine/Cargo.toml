[package]
name = "ferriscd-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Pure GitOps reconciliation engine, manifest renderer, diff, and sync planner for FerrisCD"

[lints]
workspace = true

[features]
# Exposes the deterministic `FakeGitClient` Git test harness (`repo::fake`) to downstream
# crates such as `ferriscd-controller` and integration-test targets. Never enabled in
# production builds; it is always compiled for this crate's own tests.
test-utils = []
# `T20.2`: the audited, embedded OPA/Rego engine (`policy::rego::RegorusEvaluator`, built on the
# pure-Rust `regorus` interpreter). Enabled by `ferriscd-controller/opa-policy` and therefore
# reachable from `ferriscd controller` and the API server; a build without the feature keeps a
# `Rego` policy rule a **compile error**, so it fails closed instead of being silently skipped.
opa-policy = ["dep:regorus"]

[dependencies]
base64.workspace = true
dashmap.workspace = true
ferriscd-crd.workspace = true
gix.workspace = true
jsonptr.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
# Only linkable behind `opa-policy`; a default build carries no Rego interpreter at all.
regorus = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

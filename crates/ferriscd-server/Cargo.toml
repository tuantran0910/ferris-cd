[package]
name = "ferriscd-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "In-process axum REST API, OpenAPI contract, and Git webhooks for the FerrisCD control plane"

[lints]
workspace = true

[dependencies]
axum.workspace = true
# `T19.1`: JOSE decoding of the JWT/JWKS documents the IdP serves (already a workspace dependency).
base64.workspace = true
ferriscd-controller.workspace = true
ferriscd-crd.workspace = true
# The shared diff engine (`ferriscd_engine::diff`) and `ResourceKey`: the API never re-implements
# redaction or key parsing.
ferriscd-engine.workspace = true
futures.workspace = true
# NOTE: never enable a `k8s-openapi` version feature here; the binary crate (`ferriscd-cli`)
# decides, exactly as for `ferriscd-crd`/`ferriscd-engine`.
k8s-openapi.workspace = true
kube.workspace = true
# `T19.1`: the OIDC discovery + JWKS fetches (async rustls, bounded timeouts, no redirects). The
# same `reqwest` the CLI already uses; no second HTTP stack.
reqwest.workspace = true
# `T19.1`: RS256/ES256/ES384/EdDSA signature verification. `ring` is the workspace's pinned
# `rustls` provider, so no new package enters the build.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
# Constant-time HMAC/token comparison (`T14.2`); already in the lock file.
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# `tower::ServiceExt::oneshot` drives the router in-process in tests; the API server itself is
# served by `axum::serve`.
tower.workspace = true
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
# `start_paused`/`tokio::time::advance` drive the webhook debounce deterministically: the fan-out
# tests advance a paused clock instead of sleeping, so they cannot be timing-flaky.
tokio = { workspace = true, features = ["test-util"] }
# The test target needs a Kubernetes version feature for the `Application`/`AppProject` types, and
# a library crate must not enable one for its consumers (ADR-002 §3).
k8s-openapi = { workspace = true, features = ["v1_35"] }
# The live test's Git fixture repository.
tempfile.workspace = true

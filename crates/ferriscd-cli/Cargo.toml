[package]
name = "ferriscd-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Command-line interface (`ferriscd`) for standalone GitOps operations and controller execution"

[[bin]]
name = "ferriscd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
ferriscd-controller.workspace = true
ferriscd-crd.workspace = true
ferriscd-engine.workspace = true
ferriscd-server.workspace = true
tokio-util.workspace = true
k8s-openapi = { workspace = true, features = ["v1_35"] }
kube.workspace = true
# `T14.5`: the API client. The CLI is a binary crate, so the `k8s-openapi` version feature above is
# allowed here (ADR-002 §3) — `ferriscd-server` stays version-agnostic.
reqwest.workspace = true
# The CLI's `--output json|yaml` and its typed reads of `ferriscd_server::api` DTOs.
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
# Typed client errors (`ClientError`): the same derive the controller and the server use.
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Asserts the exported OpenAPI document is the JSON the server serves.
serde_json.workspace = true
# The CLI tests drive the real client against a local `axum` server on `127.0.0.1:0` (no cluster, no
# external network, no sleeps), so the HTTP paths, status mapping and exit codes are exercised end to
# end. `axum` is already a workspace dependency (`ferriscd-server` serves with it).
axum.workspace = true
# Unix permission assertions on the stored token file (`0600`).
tempfile.workspace = true
# `T18.4`: the live OCI suite (`tests/v1_2_oci_and_drift.rs`) addresses the artifacts it pushes to a
# `registry:2` by digest, so the test computes the SHA-256 of each layer it uploads. `sha2` is
# already in the lock file (the engine verifies OCI layer digests with it), so this adds no package.
sha2.workspace = true
# `T19.4`: the live notifications suite (`tests/v0_5_notifications.rs`) runs an in-test **HTTPS**
# receiver so the controller's `--notifications-ca-file` path is proven against a private CA with an
# IP SAN. `rustls` is already a workspace dependency (and already in `Cargo.lock` via `reqwest`), so
# this adds no package; `std` provides the blocking `StreamOwned` the receiver serves with.
rustls = { workspace = true, features = ["std", "tls12"] }

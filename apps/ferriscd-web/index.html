<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="FerrisCD — a Kubernetes-native GitOps continuous delivery control plane."
    />
    <link rel="icon" type="image/svg+xml" href="/ferriscd-mark.svg" />
    <title>FerrisCD — GitOps Control Plane</title>
    <script>
      try {
        const stored = localStorage.getItem("ferriscd-theme");
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>

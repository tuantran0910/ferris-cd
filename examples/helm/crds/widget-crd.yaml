# A CRD shipped in `crds/`. `helm template` renders it ONLY when `--include-crds` is passed, which
# FerrisCD does exclusively for `spec.source.renderer.helm.includeCRDs: true` — pruning a CRD
# deletes every custom resource of that type, so it is never managed by accident.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
  labels:
    app.kubernetes.io/part-of: ferriscd-render-demo
spec:
  group: example.com
  names:
    kind: Widget
    plural: widgets
    singular: widget
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string

# A brand-new CustomResourceDefinition plus one of its custom resources, in the same commit.
#
# This is the bundle the `T08.3` live test applies: FerrisCD must apply the CRD, wait for
# `status.conditions[type=Established, status=True]`, refresh its discovery cache, and only then
# resolve and create the `Widget` below — all on the **first** sync.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
  labels:
    app.kubernetes.io/part-of: ferriscd-crd-and-cr-example
spec:
  group: example.com
  names:
    kind: Widget
    plural: widgets
    singular: widget
    shortNames:
      - wdg
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
                  minimum: 1
                color:
                  type: string
                  enum:
                    - red
                    - green
                    - blue
              required:
                - size

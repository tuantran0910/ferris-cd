apiVersion: apps/v1
kind: Deployment
metadata:
  name: render-app
  namespace: ferriscd-render
  labels:
    app.kubernetes.io/name: render-app
    app.kubernetes.io/part-of: ferriscd-render-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: render-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: render-app
        app.kubernetes.io/part-of: ferriscd-render-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: render-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base bundle for the Phase 11 Kustomize example. Everything here is local: FerrisCD rejects
# remote `resources`/`bases`/`components` before kustomize runs, so this file must never
# reference an http(s):// or git:: path.
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

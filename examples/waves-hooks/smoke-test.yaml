# A `PostSync` hook: it runs only after every `Sync` wave is `Healthy` (T10.3).
#
# `HookSucceeded` reaps the Job as soon as it completes, so repeated syncs do not pile up finished
# Jobs (T10.4). With a `generateName` hook there is no previous run to delete first.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: smoke-
  labels:
    app.kubernetes.io/part-of: ferriscd-waves-hooks-example
  annotations:
    ferriscd.io/hook: PostSync
    ferriscd.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'echo "smoke test: GET / -> ok"; sleep 1'
